<!--

CSS position: relative
An element with position: relative; is positioned relative to its normal position in the document flow.

Setting the top, right, bottom, and left properties will cause the element to be adjusted away from its normal position. Other content will not be adjusted to fit into any gap left by the element.

-->

<!--

Absolute means container upar aa jayeaga and apni original space chod dega and jo use niche wala container hoga vo uski jgh le legaa 

and jo absolute hoga vo apne parent container se bhi bahr jaa skt hai 

agar hum ye nhi cahte ki esa ho to parent container ko relative kar dege 
to jo container abosolute hoga vo sirf us container ke andar hi move kar payegaa

without position property hum left right top bottom use nhi kar sakte 

jo relative hote hai vo apne original position par kisi ko nhi aane dete 

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Position</title>

    <style>
        #box-1 {
            height: 160px;
            width: 160px;
            border: 1px solid black;
            background-color: red;
            /* position: absolute; */
            /* left:40px; */
        }
        #box {
            height: 300px;
            width: 300px;
            border: 1px solid black;
            background-color: greenyellow;
            position: relative;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            text-transform: uppercase;
            left: 40%;
            /* 
            maine box ko right mai move kar diya par uski jagh box 3 upaar nhi aaya matlab jo raltive hote hai vo apni original position nhi chodte hai 
            */
        }

        #child-box {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: rgb(255, 47, 227);
            color: white;
            text-align: center;
            padding: 10px;

            /* Child is only moving in the parent container */
            position: absolute;
            /* left: 500px; */
            left: 40%;
            top: 100px;

        }
         #box-3 {
            height: 200px;
            width: 200px;
            border: 1px solid black;
            background-color: aqua;
            
        }

    </style>
</head>
<body>

    <div id="box-1">
        im box-1
    </div>

    <div id="box">
        box-2
        <div id="child-box">
            Child box
        </div>
    </div>

    <div id="box-3">
        im box-3
    </div>
    
</body>
</html>
