<!--

CSS position: sticky
An element with position: sticky; toggles between a relative and fixed position, depending on the scroll position.

A sticky element is positioned relative until a certain scroll position is reached - then it "sticks" in that place (like position:fixed).


Note: You must specify at least one of the top, right, bottom or left properties, for sticky positioning to work.

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            margin: 0;
            padding: 0;
        }

        img {
            height: 100%;
            width: 100%;
            background-size: cover;
            background-position: center;
        }

        h1 {
            padding: 10px;
            text-align: center;
            background-color: rgb(27, 28, 28);
            color: white;
            position: sticky;
            top: 0%;
            font-weight: bolder;
            text-transform: uppercase;
            word-spacing: 10px;
        }

        h2 {
            padding: 10px;
            text-align: center;
            background-color: rgb(74, 203, 74);
            color: white;
            position: sticky;
            top: 10%;
            font-weight: bolder;
            text-transform: uppercase;
            word-spacing: 10px;
        }

    </style>
</head>
<body>

    <img src="https://images.unsplash.com/photo-1761850648640-2ee5870ee883?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw4fHx8ZW58MHx8fHx8" alt="">

    <h1>This is Sticky</h1>

    <img src="https://images.unsplash.com/photo-1767875762123-ef62592784f6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxOXx8fGVufDB8fHx8fA%3D%3D">

    <h2>This is Sticky im heading 2</h2>

    <img src="https://images.unsplash.com/photo-1766548730089-e446483315b1?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxMnx8fGVufDB8fHx8fA%3D%3D" alt="">
    
</body>
</html>
