<!--

CSS position: absolute
An element with position: absolute; is positioned relative to the nearest positioned ancestor (with position other than static).

However; if an absolute positioned element has no positioned ancestors, it uses the document body, and moves along with page scrolling.

Note: Absolute positioned elements are removed from the normal document flow, and can overlap other elements.

Here is a simple example:

This <div> element has position: relative;This <div> element has position: absolute;
Here is the CSS that is used:

-->


<!--

Absolute means container upar aa jayeaga and apni original space chod dega and jo use niche wala container hoga vo uski jgh le legaa 

and jo absolute hoga vo apne parent container se bhi bahr jaa skt hai 

agar hum ye nhi cahte ki esa ho to parent container ko relative kar dege 
to jo container abosolute hoga vo sirf us container ke andar hi move kar payegaa

without position property hum left right top bottom use nhi kar sakte 

-->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        #box-1 {
            height: 160px;
            width: 160px;
            border: 1px solid black;
            background-color: red;
            /* position: absolute; */
            /* left:40px; */
        }
        #box-2 {
            height: 180px;
            width: 180px;
            border: 1px solid black;
            background-color: greenyellow;
            position: absolute;
        }
        #box-3 {
            height: 200px;
            width: 200px;
            border: 1px solid black;
            background-color: aqua;
            
        }
        #child-box {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: rgb(255, 47, 227);
            color: white;
            text-align: center;
            padding: 10px;

            /* Moving outside the parent box*/
            position: absolute;
            left: 400px;
        }
    </style>
</head>
<body>
    
    <div id="box-1">
        box-1
    </div>

    
    <div id="box-2">
        box-2
        <div id="child-box">
            Child box
        </div>
    </div>

    
    <div id="box-3">
        box-3
    </div>

</body>
</html>
