<!--

CSS position: static
All HTML elements are positioned static by default.

Static positioned elements are not affected by the top, bottom, left, and right properties.

An element with position: static; is always positioned according to the normal flow of the page:

This <div> element has position: static;
Here is the CSS that is used:

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Property</title>
    <STYle>

        div {
            height: 200px;
            width: 200px;
            border: 2px solid black;
            background-color: rgb(129, 230, 230);
            display: flex;
            text-align: center;
            justify-content: center;
            align-items: center;
        }

    </STYle>
</head>
<body>

    <div>
        This is Absolute
    </div>
    
</body>
</html>
